[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pywatts"
version = "0.1.0"
description = "Indoor-trainer ERG workout app (FTMS over BLE)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyQt6>=6.7", "pyqtgraph>=0.13.7", "numpy", "bleak>=1.0", "platformdirs>=4", "fit-tool>=0.9.13", "httpx>=0.27", "keyring>=25", "pyte>=0.8.2", "pywinpty>=3; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest", "pytest-qt", "ruff"]

[project.scripts]
pywatts = "pywatts.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pywatts.ui" = ["assets/*.svg", "assets/*.png", "assets/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
qt_api = "pyqt6"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
